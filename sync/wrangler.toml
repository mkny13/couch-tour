name = "couch-tour-sync"
main = "src/index.ts"
compatibility_date = "2026-08-01"

[[d1_databases]]
binding = "DB"
database_name = "couch-tour-sync"
database_id = "20840aeb-15d2-4dd8-ba5a-c1e78233cea2"

# Daily tombstone purge (D121/D126's retentionFloorSeq contract, finally wired to a job) — see
# purgeOldTombstones in src/index.ts. Off-peak UTC hour; this app has no peak hours that matter.
[triggers]
crons = ["0 4 * * *"]

# Rate limit on the one endpoint an unauthenticated caller can make the database grow through:
# POST /pair/start with no token bootstraps a group + device + seq + pairing row every time
# (D150). Authenticated endpoints don't need one — abusing them costs an attacker a valid
# device token first, and revoking it is a one-request fix.
#
# 5 per 10s per IP is far above real use (a human taps "Pair" and reads a code) and far below
# useful abuse. Note the binding is per-Cloudflare-location, not global — it raises the cost of
# scripted bootstrap, it doesn't make it impossible.
[[ratelimits]]
name = "PAIR_START_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 5
  period = 10

# Staging deploy target for the merge-gate pipeline (issue #249): `wrangler deploy --env
# staging` ships to its own Worker + D1 database first, so a broken deploy 500s a throwaway
# database instead of the one real devices sync through. Named environments don't inherit
# bindings from the top-level config, so everything prod has above — D1, the rate limiter —
# is redeclared here rather than assumed shared. `[triggers]`'s cron *does* inherit (unlike
# bindings) and runs the daily purge against staging's own database too; harmless, since a
# database that only ever holds smoke-test rows has nothing old enough to purge.
[env.staging]
name = "couch-tour-sync-staging"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "couch-tour-sync-staging"
database_id = "97e24b89-1f80-4e53-b035-9fb043fda8f3"

[[env.staging.ratelimits]]
name = "PAIR_START_LIMITER"
namespace_id = "1002"

  [env.staging.ratelimits.simple]
  limit = 5
  period = 10
