name: Unit tests

# The whole suite is local — Robolectric and MockWebServer, no device or emulator — but it
# still needs the Android SDK and every androidx artifact from Google's Maven (dl.google.com).
# The environment this repo is usually developed from can't reach that host, so the tests run
# here instead. Same reasoning as build-debug-apk.yml, which says so for the APK build.
on:
  pull_request:
    # `test` is the required status check on main (#559, D336, scripts/apply-branch-protection.sh),
    # so this workflow must report on every PR. A paths: filter would leave docs-only and
    # macos-only PRs waiting on a check that never runs. Cost: the ~1-2 min Android suite now
    # runs on PRs that can't affect it.
  # No push:[main] trigger — merges go through a PR (CLAUDE.md's autonomous merge policy), and
  # a squash-merged commit is the same diff the pull_request run already tested, so a second
  # run here would just be ~50-90s of redundant CI time on every merge. workflow_dispatch below
  # still covers the rare direct-to-main push if it ever needs a manual re-check.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Symlink Android Studio JDK for verify compatibility
        run: |
          sudo mkdir -p "/Applications/Android Studio.app/Contents/jbr/Contents"
          sudo ln -sfn "$JAVA_HOME" "/Applications/Android Studio.app/Contents/jbr/Contents/Home"

      - name: Run unit tests (including Compose UI suites)
        run: JAVA_HOME="/Applications/Android Studio.app/Contents/jbr/Contents/Home" ./gradlew testDebugUnitTest

      # The HTML report is the useful artifact on a failure; Gradle's console output only
      # names the failing test, not the assertion.
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests/testDebugUnitTest/

      - name: Source guard — syncBaseUrl intent extra must be debug-gated
        run: scripts/test_sync_base_url_intent_guard.sh

      - name: Sync deploy schema-change detection (headless)
        run: scripts/test_sync_schema_changed.sh

      - name: Smoke sync round-trip orchestration (headless)
        run: |
          bash scripts/smoke/test_sync_roundtrip.sh
          bash scripts/smoke/test_mac_library_phishin_playlists.sh
          bash scripts/smoke/check-journeys.sh
