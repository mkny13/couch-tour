name: Contract drift check
# Weekly: re-record the live phish.in and Relisten responses (scripts/contracts/record.sh, D319)
# over the checked-in fixtures, then run the decode tests against them. Values change with the
# catalog, so nothing is diffed; a decode failure means the upstream shape drifted from our DTOs.
on:
  schedule:
    - cron: "41 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # A recorder failure (endpoint gone, renamed field the script indexes) is drift too.
      - name: Record live responses
        id: record
        run: scripts/contracts/record.sh

      - name: Decode recorded fixtures
        id: decode
        if: steps.record.outcome == 'success'
        run: ./gradlew testDebugUnitTest --tests 'dev.mike.couchtour.ContractFixturesTest'

      - name: File or update drift issue
        if: failure() && (steps.record.outcome == 'failure' || steps.decode.outcome == 'failure')
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RECORD: ${{ steps.record.outcome }}
          DECODE: ${{ steps.decode.outcome }}
        run: |
          title="Upstream API contract drift detected"
          body="The weekly contract check failed (recorder: $RECORD, decode tests: $DECODE).
          Run: $RUN_URL

          phish.in or Relisten changed shape against our DTOs. Re-record with \`scripts/contracts/record.sh\`, run the Android and CouchTourKit tests, and fix the DTO that fails to decode (D319)."
          existing=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number,title \
            --jq "map(select(.title == \"$title\")) | .[0].number // empty")
          if [ -n "$existing" ]; then
            gh issue comment "$existing" -R "$GITHUB_REPOSITORY" --body "<!-- mahler:agent -->
          Still drifting. $RUN_URL"
          else
            gh issue create -R "$GITHUB_REPOSITORY" --title "$title" --body "$body" \
              --label type:bug --label p2 --label mahler
          fi
