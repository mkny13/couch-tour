name: Build and Release macOS App

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag (e.g. v0.51 or v0.53)"
        required: true
        type: string
      is_beta:
        description: "Build beta target (CouchTourBeta)"
        required: false
        type: boolean
        default: false
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install tools
        run: |
          brew install xcodegen

      - name: Select Xcode 16.2
        run: sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer

      - name: Generate Xcode project
        run: |
          cd macos
          xcodegen generate

      - name: Build macOS app
        env:
          IS_BETA: ${{ inputs.is_beta || github.event.release.prerelease }}
          TAG_NAME: ${{ inputs.release_tag || github.event.release.tag_name }}
        run: |
          tag="${TAG_NAME:-$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.51")}"
          clean_ver="${tag#v}"
          clean_ver="${clean_ver%-beta}"

          if [ "$IS_BETA" = "true" ]; then
            scheme="CouchTourBeta"
            app_name="Couch Tour Beta.app"
            zip_name="CouchTourBeta-${tag}.zip"
            version="${clean_ver}-beta"
          else
            scheme="CouchTour"
            app_name="Couch Tour.app"
            zip_name="CouchTour-${tag}.zip"
            version="${clean_ver}"
          fi

          cd macos
          xcodebuild -project CouchTour.xcodeproj -scheme "$scheme" \
            -configuration Release -destination 'platform=macOS' \
            -derivedDataPath build \
            MARKETING_VERSION="$version" CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" build
            
          cd build/Build/Products/Release
          ditto -c -k --sequesterRsrc --keepParent "$app_name" "$zip_name"

          echo "ZIP_PATH=macos/build/Build/Products/Release/$zip_name" >> $GITHUB_ENV
          echo "ZIP_NAME=$zip_name" >> $GITHUB_ENV
          echo "TAG_NAME=$tag" >> $GITHUB_ENV
          if [ "$IS_BETA" = "true" ]; then
            echo "APPCAST_NAME=appcast-beta.xml" >> $GITHUB_ENV
          else
            echo "APPCAST_NAME=appcast.xml" >> $GITHUB_ENV
          fi

      - name: Upload zip to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$TAG_NAME" "$ZIP_PATH" --clobber

      - name: Sign update and regenerate appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          generate_appcast="macos/build/SourcePackages/artifacts/sparkle/Sparkle/bin/generate_appcast"
          stage="$RUNNER_TEMP/appcast-stage"
          mkdir -p "$stage"
          cp "$ZIP_PATH" "$stage/"
          cp "$APPCAST_NAME" "$stage/" 2>/dev/null || true

          echo "$SPARKLE_PRIVATE_KEY" | "$generate_appcast" \
            --ed-key-file - \
            -o "$stage/$APPCAST_NAME" \
            --download-url-prefix "https://github.com/mkny13/couch-tour/releases/download/$TAG_NAME/" \
            "$stage"

          echo "APPCAST_STAGE=$stage" >> $GITHUB_ENV

      - name: Commit updated appcast to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Retry up to 5 times in case a concurrent push (e.g. cut-beta.sh, another
          # release workflow) lands between our fetch and push, causing a non-fast-forward
          # rejection. Rebase re-applies our appcast change on top of whatever arrived.
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git checkout main
            # The build step's xcodebuild run resolves Sparkle into CouchTourKit's own
            # Package.resolved as a side effect (SPM quirk with a local package sibling to an
            # external dependency in the same workspace) — that leaves an unstaged, unrelated
            # change in the working tree, which git rebase refuses to run over. Discard it;
            # this step only ever means to commit APPCAST_NAME.
            git checkout -- .
            git rebase origin/main
            cp "$APPCAST_STAGE/$APPCAST_NAME" "$APPCAST_NAME"
            git add "$APPCAST_NAME"
            if git diff --cached --quiet; then
              echo "No appcast changes to commit."
              break
            fi
            git commit -m "Update $APPCAST_NAME for $TAG_NAME"
            if git push origin main; then
              break
            fi
            echo "Push rejected (attempt $attempt/5), rebasing and retrying..."
            git reset --soft HEAD~1
          done
