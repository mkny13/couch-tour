name: macOS unit tests

# Runs CouchTourKit's plain SwiftPM test suite alongside an unsigned Debug build of the
# macOS app target (macos/CouchTour) and a small deterministic XCUITest suite
# (macos/CouchTourUITests) on a GitHub-hosted macOS runner. This ensures that neither
# changes to shared core logic (API clients, catalog model, queue-key grammar, progress
# storage) nor UI/app-layer changes silently break compilation, tests, or the UI chrome
# covered by the harness (sort, tag filter, context menu, artwork badge).
on:
  pull_request:
    paths:
      - "macos/**"
      - ".github/workflows/macos-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos-test:
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # Keyed on the manifest and lockfile so a dependency bump rebuilds from scratch.
      - uses: actions/cache@v6
        with:
          path: macos/Packages/CouchTourKit/.build
          key: spm-${{ runner.os }}-${{ hashFiles('macos/Packages/CouchTourKit/Package.swift', 'macos/Packages/CouchTourKit/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Run CouchTourKit tests
        run: swift test --package-path macos/Packages/CouchTourKit

  macos-build:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install tools
        run: brew install xcodegen

      - name: Select Xcode 16.2
        run: sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer

      - name: Generate Xcode project
        working-directory: macos
        run: xcodegen generate

      - name: Build macOS app (Debug, unsigned)
        working-directory: macos
        run: xcodebuild -project CouchTour.xcodeproj -scheme CouchTour -configuration Debug -destination 'platform=macOS' build CODE_SIGNING_ALLOWED=NO

      # Ad-hoc signed ("Sign to Run Locally") because XCUITest's runner app must be signed
      # to launch; the unsigned build above stays as the plain compile gate.
      - name: Run macOS XCUITests
        working-directory: macos
        run: xcodebuild -project CouchTour.xcodeproj -scheme CouchTour -configuration Debug -destination 'platform=macOS' test -only-testing:CouchTourUITests CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM=
