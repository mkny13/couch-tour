name: macOS tests

# Runs both the shared package suite and a small deterministic XCUITest suite for the
# macOS app target, so UI regressions in sort/tag/context-menu/artwork chrome are caught on PRs.
on:
  pull_request:
    paths:
      - "macos/CouchTour/**"
      - "macos/CouchTourUITests/**"
      - "macos/Packages/CouchTourKit/**"
      - "macos/project.yml"
      - ".github/workflows/macos-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos-test:
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Keyed on the manifest and lockfile so a dependency bump rebuilds from scratch.
      - uses: actions/cache@v4
        with:
          path: macos/Packages/CouchTourKit/.build
          key: spm-${{ runner.os }}-${{ hashFiles('macos/Packages/CouchTourKit/Package.swift', 'macos/Packages/CouchTourKit/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Run CouchTourKit tests
        working-directory: macos/Packages/CouchTourKit
        run: swift test

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: macos
        run: xcodegen generate

      - name: Run macOS XCUITests
        working-directory: macos
        run: xcodebuild -project CouchTour.xcodeproj -scheme CouchTour -destination 'platform=macOS' test -only-testing:CouchTourUITests
