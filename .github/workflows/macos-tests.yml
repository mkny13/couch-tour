name: macOS unit tests

# Runs CouchTourKit's plain SwiftPM test suite alongside an unsigned Debug build of the
# macOS app target (macos/CouchTour) on a GitHub-hosted macOS runner. This ensures that
# neither changes to shared core logic (API clients, catalog model, queue-key grammar,
# progress storage) nor UI/app-layer changes silently break compilation or tests.
on:
  pull_request:
    paths:
      - "macos/**"
      - ".github/workflows/macos-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos-test:
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Keyed on the manifest and lockfile so a dependency bump rebuilds from scratch.
      - uses: actions/cache@v4
        with:
          path: macos/Packages/CouchTourKit/.build
          key: spm-${{ runner.os }}-${{ hashFiles('macos/Packages/CouchTourKit/Package.swift', 'macos/Packages/CouchTourKit/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Run CouchTourKit tests
        working-directory: macos/Packages/CouchTourKit
        run: swift test

  macos-build:
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: brew install xcodegen

      - name: Select Xcode 16.2
        run: sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer

      - name: Generate Xcode project
        working-directory: macos
        run: xcodegen generate

      - name: Build macOS app (Debug, unsigned)
        working-directory: macos
        run: xcodebuild -project CouchTour.xcodeproj -scheme CouchTour -configuration Debug -destination 'platform=macOS' build CODE_SIGNING_ALLOWED=NO
