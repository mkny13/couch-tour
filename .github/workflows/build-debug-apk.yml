name: Build debug APK

# Builds a sideloadable, debug-signed APK. This exists because the tool that made this repo's
# earlier releases doesn't always run somewhere with network access to Google's Maven
# (dl.google.com), which every androidx/AGP artifact is hosted on — a GitHub-hosted runner
# always does, so the build happens here instead.
on:
  push:
    branches: [main]
    # Docs-only or macOS-only merges (ROADMAP.md, DECISIONS.md, macos/**) don't touch anything
    # this build depends on — filtering keeps those merges from burning ~80s on a pointless
    # APK build every time.
    paths:
      - "app/**"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/build-debug-apk.yml"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional: create a GitHub Release at this tag (e.g. v0.11) with the APK attached"
        required: false
        type: string
      release_notes:
        description: "Release notes, used only when release_tag is set"
        required: false
        type: string
      prerelease:
        description: "Mark the GitHub release as a pre-release (beta)"
        required: false
        type: boolean
        default: false
      side_install:
        description: "Build as dev.mike.couchtour.beta (\"Couch Tour Beta\") so it installs alongside the regular app instead of updating over it"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # Without this, AGP auto-generates a fresh debug keystore on every run, since a
      # GitHub-hosted runner starts clean and keeps nothing between builds. Each build would
      # then carry a different random debug signing key, so installing a CI build over a
      # locally-built one (or over the previous CI build) fails outright with "App not
      # installed" rather than updating — exactly what happened installing v0.2a.
      # The secret is this repo's own local ~/.android/debug.keystore, base64-encoded, so
      # every build — local or CI — signs with the same key and updates in place. Falls
      # back to AGP's auto-generated keystore if the secret isn't set (e.g. a fork's runs,
      # which can't see this repo's secrets), same as before this existed.
      #
      # Written to BOTH ~/.android/ and ~/.config/.android/: AGP 8.10 on this runner logs
      # "Creating default debug keystore at /home/runner/.config/.android/debug.keystore" —
      # the newer XDG Base Directory path, not the classic ~/.android/ every guide (including
      # this workflow's first attempt at this fix) assumes. Covering both is cheap insurance
      # against that differing again by platform or AGP version.
      - name: Restore debug keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            mkdir -p ~/.android ~/.config/.android
            echo "$DEBUG_KEYSTORE_BASE64" | base64 --decode > ~/.android/debug.keystore
            cp ~/.android/debug.keystore ~/.config/.android/debug.keystore
            sha256sum ~/.android/debug.keystore ~/.config/.android/debug.keystore
          else
            echo "DEBUG_KEYSTORE_BASE64 secret is empty or unset"
          fi

      - name: Assemble debug APK
        env:
          SIDE_INSTALL: ${{ inputs.side_install }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          args=()
          if [ "$SIDE_INSTALL" = "true" ]; then
            args+=(-PsideInstall=true)
          fi
          # Threads the release tag into BuildConfig.VERSION_NAME (app/build.gradle.kts) so a
          # build cut for e.g. v0.23 actually reports v0.23 in the app, not the static
          # placeholder — see #43.
          if [ -n "$RELEASE_TAG" ]; then
            args+=(-PversionName="$RELEASE_TAG")
          fi
          ./gradlew assembleDebug "${args[@]}"

      - uses: actions/upload-artifact@v4
        with:
          name: couch-tour-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Create release
        if: ${{ inputs.release_tag != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
          NOTES: ${{ inputs.release_notes }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          asset="couch-tour-${TAG}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$asset"
          printf '%s\n' "$NOTES" > RELEASE_NOTES.md
          flags=(--title "$TAG" --notes-file RELEASE_NOTES.md)
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
          gh release create "$TAG" "$asset" "${flags[@]}"
