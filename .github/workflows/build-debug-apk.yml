name: Build debug APK

# Builds a sideloadable, debug-signed APK. This exists because the tool that made this repo's
# earlier releases doesn't always run somewhere with network access to Google's Maven
# (dl.google.com), which every androidx/AGP artifact is hosted on — a GitHub-hosted runner
# always does, so the build happens here instead.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug APK
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: couch-tour-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
