name: Checks

# Grep-level gates that need no Java/Gradle, so they fail in seconds (see test.yml for the suite).
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mockup-data:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Self-test the mockup-data check
        run: scripts/checks/test_check_mockup_data.sh
      - name: Check shipping code for mockup/placeholder data
        run: scripts/checks/check-mockup-data.sh
  workflow-permissions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Self-test the workflow-permissions check
        run: scripts/checks/test_check_workflow_permissions.sh
      - name: Check every workflow declares top-level permissions
        run: scripts/checks/check-workflow-permissions.sh
  hook-paths:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Verify hook paths resolve via $CLAUDE_PROJECT_DIR from any cwd
        run: scripts/check_hook_paths.sh
  xcuitest-count:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Self-test the xcuitest-count check
        run: scripts/checks/test_check_xcuitest_count.sh
      - name: Check README XCUITest count matches CouchTourUITests.swift
        run: scripts/checks/check-xcuitest-count.sh
  appcast:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Self-test the appcast check
        run: scripts/checks/test_check_appcast.sh
