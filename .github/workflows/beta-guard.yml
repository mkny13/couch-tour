name: Beta promotion guard
on:
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Check beta/production gap
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/beta_guard.py
