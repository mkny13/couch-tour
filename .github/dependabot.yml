version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    groups:
      non-major:
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      non-major:
        update-types:
          - minor
          - patch
  - package-ecosystem: npm
    directory: /sync
    schedule:
      interval: weekly
    groups:
      non-major:
        update-types:
          - minor
          - patch
  - package-ecosystem: swift
    directory: /macos/Packages/CouchTourKit
    schedule:
      interval: weekly
    groups:
      non-major:
        update-types:
          - minor
          - patch
